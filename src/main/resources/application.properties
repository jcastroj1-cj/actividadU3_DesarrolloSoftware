
server.port=8080
spring.security.filter.order=10

spring.datasource.url=jdbc:mysql://localhost:3307/crudcelulares?useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL
# 2. Credenciales
spring.datasource.username=root
spring.datasource.password=

# 3. Driver y Dialecto explícito (Esto evita que Hibernate tenga que adivinarlo)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Estrategia de creación de tablas (opcional pero recomendado en desarrollo)
spring.jpa.hibernate.ddl-auto=update